<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="سياسة الخصوصية لتطبيق koora info: البيانات التي يعالجها التطبيق، استخداماتها، الخدمات المساندة، واختيارات المستخدم."
    />
    <meta name="theme-color" content="#0b0d12" />
    <title>سياسة الخصوصية | koora info</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="koora info">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span class="brand-text">koora info</span>
      </a>
      <nav class="actions" aria-label="Page actions">
        <button class="icon-button" id="theme-toggle" type="button">
          <span class="theme-icon" aria-hidden="true"></span>
          <span data-i18n="actions.theme">الوضع</span>
        </button>
        <button class="icon-button" id="language-toggle" type="button">
          <span class="lang-icon" aria-hidden="true">ع</span>
          <span data-i18n="actions.language">English</span>
        </button>
        <button class="icon-button print-only-hide" id="print-button" type="button">
          <span class="print-icon" aria-hidden="true"></span>
          <span data-i18n="actions.print">طباعة</span>
        </button>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-content">
          <div class="hero-copy">
            <p class="eyebrow" data-i18n="hero.kicker">حماية البيانات</p>
            <h1 id="page-title" data-i18n="hero.title">سياسة الخصوصية</h1>
            <p class="hero-summary" data-i18n="hero.summary">
              نوضح هنا ما يعالجه التطبيق فعلياً، ولماذا، وكيف يمكنك التحكم في بياناتك.
            </p>
          </div>
          <div class="hero-pills" aria-label="Policy highlights">
            <span class="pill" data-i18n="hero.effective">سارية من 17 مايو 2026</span>
            <span class="pill" data-i18n="hero.updated">آخر تحديث 17 مايو 2026</span>
            <span class="pill" data-i18n="hero.noSelling">لا بيع للبيانات</span>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <img src="koora_info.png" alt="" />
        </div>
      </section>

      <section class="trust-strip" aria-label="Privacy highlights">
        <article class="trust-item">
          <span class="trust-number">01</span>
          <strong data-i18n="hero.effective">سارية من 17 مايو 2026</strong>
        </article>
        <article class="trust-item">
          <span class="trust-number">02</span>
          <strong data-i18n="hero.updated">آخر تحديث 17 مايو 2026</strong>
        </article>
        <article class="trust-item">
          <span class="trust-number">03</span>
          <strong data-i18n="hero.noSelling">لا بيع للبيانات</strong>
        </article>
      </section>

      <section class="layout">
        <div class="policy">
          <div id="policy-sections"></div>
          <footer class="policy-footer">
            <strong>koora info</strong>
            <span data-i18n="footer.updated">آخر تحديث: 17 مايو 2026</span>
          </footer>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
